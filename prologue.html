><h2 class="sectionTitle">人生记录 <small>最新事件在上方</small></h2><div id="records" aria-live="polite"><div class="empty">故事从一只停在窗台上的猫头鹰开始。</div></div></section><aside class="panel"><h2>人生轨迹</h2><p class="muted">1991年7月 — 9月1日</p><div id="progress"></div><h3>新认识的人</h3><div id="newFriends"></div><h3>已作出的决定</h3><div id="decisionsList" class="muted">尚无决定</div><h3>既有世界数据库</h3><p class="muted">原有校园、家庭、医疗、舆论、智慧族群、凤凰社等系统与全部JSON保持原样。序章完成后可进入原有游戏。</p></aside></main><script type="module" src="./js/prologueApp.js"></script></body></html>
